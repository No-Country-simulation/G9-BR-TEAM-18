name: validate-pr-source

on:
  pull_request:
    branches:
      - main
      - homolog

jobs:
  validate-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$BASE_REF" = "homolog" ] && [ "$HEAD_REF" != "dev" ]; then
            echo "❌ PRs para homolog devem vir apenas da branch dev."
            echo "   Origem atual: $HEAD_REF"
            exit 1
          fi
          if [ "$BASE_REF" = "main" ] && [ "$HEAD_REF" != "homolog" ]; then
            echo "❌ PRs para main devem vir apenas da branch homolog."
            echo "   Origem atual: $HEAD_REF"
            exit 1
          fi
          echo "✅ Source branch $HEAD_REF -> $BASE_REF is valid."
