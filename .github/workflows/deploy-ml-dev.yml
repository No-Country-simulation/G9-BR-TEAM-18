name: Build and Push ML Service (Homologação)

on:
  push:
    branches:
      - dev
    paths:
      - 'ml-service/**'
      - '.github/workflows/deploy-ml-dev.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build e Push da Imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: ./ml-service
          file: ./ml-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/energiai-ml-service:dev
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/energiai-ml-service:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/energiai-ml-service:buildcache,mode=max

      - name: Disparar Atualização no Render (Deploy Hook)
        if: success()
        run: |
          if [ -n "${{ secrets.RENDER_ML_DEPLOY_HOOK_URL }}" ]; then
            curl -X POST ${{ secrets.RENDER_ML_DEPLOY_HOOK_URL }}
          fi
