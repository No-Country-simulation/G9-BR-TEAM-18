name: revert-direct-push

on:
  push:
    branches:
      - main
      - homolog

jobs:
  enforce-protection:
    if: >
      github.event_name == 'push' &&
      github.event.head_commit.message != 'Initial commit' &&
      !startsWith(github.event.head_commit.message, 'chore: merge')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if push is a legitimate PR merge
        id: check_merge
        run: |
          COMMITTER="${{ github.event.head_commit.committer.name }}"
          USERNAME="${{ github.event.head_commit.committer.username }}"
          MESSAGE="${{ github.event.head_commit.message }}"
          PARENTS=$(git cat-file -p ${{ github.event.after }} 2>/dev/null | grep "^parent " | wc -l || echo 0)

          echo "Committer: $COMMITTER"
          echo "Username: $USERNAME"
          echo "Message: $MESSAGE"
          echo "Parents: $PARENTS"

          # PR merges via GitHub UI are always committed by "GitHub" (bot)
          # This covers: merge commit (2 parents), squash merge (1 parent),
          # and rebase merge (multiple commits, 1 parent each)
          if [ "$COMMITTER" = "GitHub" ] || [ "$USERNAME" = "web-flow" ]; then
            echo "is_pr_merge=true" >> $GITHUB_OUTPUT
          elif echo "$MESSAGE" | grep -qE "^(Merge pull request|Merge branch)"; then
            echo "is_pr_merge=true" >> $GITHUB_OUTPUT
          elif [ "$PARENTS" -gt 1 ]; then
            echo "is_pr_merge=true" >> $GITHUB_OUTPUT
          else
            echo "is_pr_merge=false" >> $GITHUB_OUTPUT
          fi

      - name: Reject direct push
        if: steps.check_merge.outputs.is_pr_merge == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          COMMITTER: ${{ github.event.head_commit.committer.name }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          echo "❌ Push direto detectado em $BRANCH por $COMMITTER"
          echo ""
          echo "Apenas merges de PR sao permitidos em $BRANCH."
          echo "Criando Issue de alerta..."

          gh issue create \
            --title "🚫 Push direto detectado em $BRANCH" \
            --label "tipo/fix" \
            --body "**Branch:** $BRANCH
          **Autor:** $COMMITTER
          **Commit:** ${{ github.event.after }}
          **Mensagem:** $MESSAGE

          Push direto em $BRANCH nao e permitido. Crie um PR a partir da branch correta:
          - **dev** -> **homolog** (para features)
          - **homolog** -> **main** (para releases)

          Se este push foi acidental, reverta manualmente ou feche esta Issue apos correcao."

          exit 1
