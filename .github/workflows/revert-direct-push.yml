name: revert-direct-push

on:
  push:
    branches:
      - main
      - homolog

jobs:
  enforce-protection:
    if: >
      github.event_name == 'push' &&
      github.event.head_commit.message != 'Initial commit' &&
      !startsWith(github.event.head_commit.message, 'chore: merge')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if push is legitimate
        id: check_merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"
          MESSAGE="${{ github.event.head_commit.message }}"

          # Allow if branch is moving backward (revert from a previous enforcement)
          if git merge-base --is-ancestor "$AFTER" "$BEFORE" 2>/dev/null; then
            echo "is_legitimate=true" >> $GITHUB_OUTPUT
            echo "Branch moving backward — allowing revert push"
            exit 0
          fi

          # Allow merge commits (2+ parents)
          PARENTS=$(git cat-file -p "$AFTER" 2>/dev/null | grep -c "^parent " || echo 0)
          if [ "$PARENTS" -gt 1 ]; then
            echo "is_legitimate=true" >> $GITHUB_OUTPUT
            echo "Merge commit (2+ parents) — allowing"
            exit 0
          fi

          # Allow standard PR merge messages
          if echo "$MESSAGE" | grep -qE "^(Merge pull request|Merge branch)"; then
            echo "is_legitimate=true" >> $GITHUB_OUTPUT
            echo "Standard merge message — allowing"
            exit 0
          fi

          # Allow squash/rebase merges via PR (message contains PR number)
          PR_NUMBER=$(echo "$MESSAGE" | grep -oP '\(#\K\d+(?=\))' | head -1)
          if [ -n "$PR_NUMBER" ]; then
            PR_JSON=$(gh pr view "$PR_NUMBER" --json state,baseRefName 2>/dev/null || echo '{}')
            PR_STATE=$(echo "$PR_JSON" | jq -r '.state // empty')
            PR_BASE=$(echo "$PR_JSON" | jq -r '.baseRefName // empty')
            if [ "$PR_STATE" = "MERGED" ] && [ "$PR_BASE" = "${{ github.ref_name }}" ]; then
              echo "is_legitimate=true" >> $GITHUB_OUTPUT
              echo "Verified PR #$PR_NUMBER merged into ${{ github.ref_name }} — allowing"
              exit 0
            fi
          fi

          # Direct push detected
          echo "is_legitimate=false" >> $GITHUB_OUTPUT

      - name: Revert direct push
        if: steps.check_merge.outputs.is_legitimate == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          MESSAGE: ${{ github.event.head_commit.message }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          echo "Direct push detected on $BRANCH by $ACTOR"
          echo "Commit: ${{ github.event.after }}"
          echo "Message: $MESSAGE"
          echo "Reverting to previous state ($BEFORE)..."

          if ! git push origin "$BEFORE:$BRANCH" --force 2>&1; then
            echo "ERROR: Failed to revert branch $BRANCH"
            gh issue create \
              --title "FAILED to revert direct push to $BRANCH" \
              --label "tipo/fix" \
              --body "**Branch:** $BRANCH
          **Author:** $ACTOR
          **Commit:** $AFTER
          **Message:** $MESSAGE

          Automatic revert FAILED. Manual intervention required.
          Run: git push origin $BEFORE:$BRANCH --force"
            exit 1
          fi

          echo "Branch reverted to $BEFORE. Creating alert issue..."
          gh issue create \
            --title "Reverted direct push to $BRANCH" \
            --label "tipo/fix" \
            --body "**Branch:** $BRANCH
          **Author:** $ACTOR
          **Commit:** $AFTER
          **Reverted to:** $BEFORE
          **Message:** $MESSAGE

          Direct push to \`$BRANCH\` was automatically reverted.
          Please follow the correct workflow:
          - \`dev\` -> \`homolog\` (features)
          - \`homolog\` -> \`main\` (releases)

          If this was a legitimate change, submit a PR from the correct source branch."

          # Notify via commit status
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/$AFTER" \
            -d '{"state":"failure","description":"Direct push reverted — use PR from correct branch","context":"revert-direct-push"}' || true
