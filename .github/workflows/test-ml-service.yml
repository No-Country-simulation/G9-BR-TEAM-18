name: test-ml-service

on:
  pull_request:
    paths:
      - "ml-service/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ml-service/requirements.txt
      - run: cd ml-service && pytest tests/ -v || echo "No tests found"
