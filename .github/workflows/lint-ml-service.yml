name: lint-ml-service

on:
  pull_request:
    paths:
      - "ml-service/**"

jobs:
  ruff-mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff mypy
      - run: cd ml-service && ruff check . && ruff format --check .
      - run: cd ml-service && mypy .
