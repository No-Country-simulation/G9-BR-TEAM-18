services:

  ml-service:
    build:
      context: .
      dockerfile: docker/ml-service.Dockerfile
    container_name: energiaia-ml
    ports:
      - "8000:8000"
    env_file:
      - ml-service/.env
    networks:
      - energiaia-net

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: energiaia-backend
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - ML_SERVICE_URL=http://ml-service:8000
    networks:
      - energiaia-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080
    container_name: energiaia-frontend
    ports:
      - "5173:5173"
    networks:
      - energiaia-net

networks:
  energiaia-net:
    driver: bridge
