services:

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: energiaia-ml
    ports:
      - "${ML_SERVICE_PORT:-8000}:8000"
    env_file:
      - ./.env
    environment:
      - ML_SERVICE_PORT=${ML_SERVICE_PORT:-8000}
    networks:
      - energiaia-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: energiaia-backend
    ports:
      - "${SERVER_PORT:-8080}:8080"
    env_file:
      - ./.env
    environment:
      - SERVER_PORT=${SERVER_PORT:-8080}
      - ML_SERVICE_URL=${ML_SERVICE_URL:-http://ml-service:8000}
      - KWH_TARIFF=${KWH_TARIFF:-0.75}
      - CO2_EMISSION_FACTOR=${CO2_EMISSION_FACTOR:-0.096}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    networks:
      - energiaia-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: energiaia-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    networks:
      - energiaia-net

networks:
  energiaia-net:
    driver: bridge
