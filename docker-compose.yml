services:

  postgres:
    image: postgres:16-alpine
    container_name: energiaia-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: energiaia
      POSTGRES_USER: energiaia
      POSTGRES_PASSWORD: energiaia123
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - energiaia-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U energiaia"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: energiaia-ml
    ports:
      - "${ML_SERVICE_PORT:-8000}:8000"
    env_file:
      - ./.env
    environment:
      - ML_SERVICE_PORT=${ML_SERVICE_PORT:-8000}
    networks:
      - energiaia-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: energiaia-backend
    ports:
      - "${SERVER_PORT:-8080}:8080"
    env_file:
      - ./.env
    environment:
      - SERVER_PORT=${SERVER_PORT:-8080}
      - ML_SERVICE_URL=${ML_SERVICE_URL:-http://ml-service:8000}
      - KWH_TARIFF=${KWH_TARIFF:-0.75}
      - CO2_EMISSION_FACTOR=${CO2_EMISSION_FACTOR:-0.096}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/energiai}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-energiai}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-energiai123}
      - SPRING_JPA_DATABASE_PLATFORM=${SPRING_JPA_DATABASE_PLATFORM:-org.hibernate.dialect.PostgreSQLDialect}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - energiaia-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    container_name: energiaia-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    networks:
      - energiaia-net

networks:
  energiaia-net:
    driver: bridge

volumes:
  pg_data:
    driver: local
