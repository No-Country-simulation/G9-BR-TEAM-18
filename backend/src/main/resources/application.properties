spring.application.name=energiai-api
server.port=${SERVER_PORT}

spring.jackson.property-naming-strategy=SNAKE_CASE

# ==============================================================================
# BANCO DE DADOS - Oracle ATP (producao ativa). Tudo via env vars.
# ==============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL}

# FLYWAY
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED}
spring.flyway.locations=${SPRING_FLYWAY_LOCATIONS}
spring.flyway.default-schema=${SPRING_FLYWAY_DEFAULT_SCHEMA}
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=${SPRING_FLYWAY_BASELINE_VERSION:0}
spring.flyway.url=${SPRING_FLYWAY_URL}
spring.flyway.user=${SPRING_FLYWAY_USER}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD}

# ==============================================================================
# SEGURANCA (JWT) E CORS
# ==============================================================================
JWT_SECRET=${JWT_SECRET}
JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS}
SESSION_SECURE=${SESSION_SECURE}
CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}

# ==============================================================================
# ML SERVICE - Anti-Corruption Layer (ACL) field mappings
# ==============================================================================
ml.service.url=${ML_SERVICE_URL}
ml.output.field.category=${ML_OUTPUT_FIELD_CATEGORY}
ml.output.field.probability=${ML_OUTPUT_FIELD_PROBABILITY}
ml.output.field.recommendations=${ML_OUTPUT_FIELD_RECOMMENDATIONS}
ml.output.field.source=${ML_OUTPUT_FIELD_SOURCE}

# ==============================================================================
# ML SERVICE - Schema Discovery default categories
# ==============================================================================
ml.default.categories=${ML_DEFAULT_CATEGORIES}

# ==============================================================================
# SPRINGDOC - OpenAPI / Swagger UI
# ==============================================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.defaultModelsExpandDepth=3
springdoc.swagger-ui.docExpansion=list
springdoc.swagger-ui.tagsSorter=alpha
springdoc.show-actuator=false
# OBRIGATORIO: URL base dos servidores listados no OpenAPI/Swagger.
# Deve ser definida via OPENAPI_SERVER_URL no .env (local: http://localhost:8080,
# Render: https://<deploy>.onrender.com). Sem ela o startup FALHA (fail-fast),
# evitando expor o contrato com URL errada ou dados sensiveis.
openapi.server.url=${OPENAPI_SERVER_URL}
