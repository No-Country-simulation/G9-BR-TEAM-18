spring.application.name=energiai-api
server.port=${SERVER_PORT:8080}

# Padronização de nomenclatura JSON para integração com o Frontend e microsserviço de Machine Learning
spring.jackson.property-naming-strategy=SNAKE_CASE

# ==============================================================================
# CONFIGURAÇÕES DE BANCO DE DADOS: ORACLE (AMBIENTE DE PRODUÇÃO/NUVEM)
# ==============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Configurações do framework de persistência (JPA/Hibernate)
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Gerenciamento de migrações de esquema (Flyway) - Escopo Oracle
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/oracle
spring.flyway.default-schema=${SPRING_DATASOURCE_USERNAME}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.url=${SPRING_DATASOURCE_URL}
spring.flyway.user=${SPRING_DATASOURCE_USERNAME}
spring.flyway.password=${SPRING_DATASOURCE_PASSWORD}


