spring.application.name=energiai-api
server.port=${SERVER_PORT:8080}

# ===================================================================
# Database — PostgreSQL (docker-compose / Render)
#
# Todas as credenciais vêm EXCLUSIVAMENTE de variáveis de ambiente:
#   Docker  → .env (via env_file no docker-compose.yml)
#   Render  → configuradas no dashboard do serviço
#
# NÃO usar defaults hardcoded — isso causa conexões falhando silenciosamente
# quando o env var não está definida (ex: localhost quando deveria ser postgres).
# ===================================================================

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM}

# Flyway — gerencia o schema; Hibernate valida apenas
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED}
spring.flyway.locations=${SPRING_FLYWAY_LOCATIONS}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL}

