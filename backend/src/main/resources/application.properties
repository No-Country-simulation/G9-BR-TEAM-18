spring.application.name=energiai-api
server.port=${SERVER_PORT:8080}

# ===================================================================
# Database — PostgreSQL (desenvolvimento local + Render/produção)
#
# Certifique-se de que o PostgreSQL esteja rodando.
# Local: o docker-compose já inclui o serviço postgres.
# Render: defina as env vars no painel para sobrescrever os defaults.
#
# Para migrar para Oracle ATP (OCI) no futuro:
#   - Comente este bloco PostgreSQL
#   - Descomente o bloco Oracle abaixo
#   - Descomente as dependências Oracle no pom.xml
#   - Adicione as migrations Oracle em db/migration/oracle/
# ===================================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/energiai}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:energiai}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:energiai123}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}

# Flyway — gerencia o schema; Hibernate valida apenas
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=${SPRING_FLYWAY_LOCATIONS:classpath:db/migration}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

