spring.application.name=energiai-api
server.port=${SERVER_PORT:8080}

spring.jackson.property-naming-strategy=SNAKE_CASE

# ==============================================================================
# BANCO DE DADOS — Oracle ATP (producao ativa). Tudo via env vars.
# ==============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:oracle.jdbc.OracleDriver}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.OracleDialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=${SPRING_FLYWAY_LOCATIONS:classpath:db/migration/oracle}
spring.flyway.default-schema=${SPRING_FLYWAY_DEFAULT_SCHEMA:ADMIN}
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${SPRING_FLYWAY_BASELINE_VERSION:0}
spring.flyway.url=${SPRING_FLYWAY_URL:${SPRING_DATASOURCE_URL}}
spring.flyway.user=${SPRING_FLYWAY_USER:${SPRING_DATASOURCE_USERNAME}}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}


# ==============================================================================
# SEGURANCA (JWT) E CORS
# ==============================================================================
JWT_SECRET=${JWT_SECRET:default-dev-secret-key-change-in-production-32chars!}
JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:604800000}
SESSION_SECURE=${SESSION_SECURE:false}
CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:*}
