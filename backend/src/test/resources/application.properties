server.port=8080

spring.jackson.property-naming-strategy=SNAKE_CASE

spring.datasource.url=jdbc:oracle:thin:@localhost:1521:XE
spring.datasource.username=test
spring.datasource.password=test
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration/oracle
spring.flyway.default-schema=ENERGIAI
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=0
spring.flyway.url=jdbc:oracle:thin:@localhost:1521:XE
spring.flyway.user=test
spring.flyway.password=test

JWT_SECRET=dummy-secret-key-for-tests-at-least-32-chars-long
JWT_EXPIRATION_MS=3600000
SESSION_MAX_AGE_SECONDS=3600
SESSION_SECURE=false
CORS_ALLOWED_ORIGINS=http://localhost:5173

ML_SERVICE_URL=http://localhost:8000
ml.output.field.category=category
ml.output.field.probability=probability
ml.output.field.recommendations=recommendations
ml.output.field.source=source

ml.default.categories=EXCELENTE,BOM,MEDIANO,RUIM,CRITICO

openapi.server.url=http://localhost:8080
